version: '3.8'

services:
  # 1. Backend API & SQLite Database
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lingo555-server
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - ./server/.env
    volumes:
      - ./server/data:/app/data
    ports:
      - "5000:5000"
    networks:
      - lingo-network

  # 2. Frontend React Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lingo555-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - lingo-network

networks:
  lingo-network:
    driver: bridge
